# Workflow smoke test: CUDAMender blackboard agent on gpt-6-luna via the AWS
# gateway (OpenAI-compatible chat completions). Performance gate off.
# Run on GPU6:
#   set -a; . ~/Dr.Sparse/.env; set +a   # provides AWS_OPENAI_API_KEY
#   CUDA_VISIBLE_DEVICES=6 python -m harness.run_experiment \
#     -c configs/agent/smoke_blackboard_gpt6_luna_gpu6.yaml \
#     --v2-task-list benchmark/task_list.json --mode debug --tasks <stem> ...
api:
  backend: openai
  model: gpt-6-luna
  base_url: https://api.ding-labs.com/v1
  api_key_env: AWS_OPENAI_API_KEY
  temperature: 0.8
  max_completion_tokens: 32768
  reasoning_effort: low
  finalization:
    enabled: true
    max_tokens: 8192
    reasoning_char_threshold: 120000
    reasoning_excerpt_chars: 8000
    fallback_reasoning_as_content: false
  json_action_finalization:
    enabled: true
    max_tokens: 8192
    reasoning_char_threshold: 120000
    reasoning_excerpt_chars: 8000
    fallback_reasoning_as_content: false
performance_gate:
  enabled: false
experiment:
  name: smoke_blackboard_gpt6_luna_gpu6
  method: agent
  max_iterations: 3
  dataset_dir: data
  output_dir: results_smoke_blackboard_gpt6_luna_gpu6
  tasks: []
build:
  timeout: 300
  test_timeout: 300
  workdir: /tmp/cuda_debugger_workspace_smoke_gpt6_luna_gpu6
  gpu_id: 0
agent:
  workflow: blackboard
  tools: null
  action_protocol: json
  json_action_response_format: false  # AWS gateway rejects response_format
  full_file_submissions: true
  tool_decision_max_tokens: 32768
  max_patch_submissions: 3
  max_tool_calls_per_task: 200
  hard_stop_stagnation: false
  performance_gate:
    enabled: false
  quotas:
    read_code: 20
    read_test_file: 10
    read_prompt: 2
    run_static_analysis: 10
    run_compute_sanitizer: 12
    build_only: 10
    test_only: 10
  blackboard:
    coder_force_locate_first: true
    max_role_turns: 3
    max_coder_turns: 8
    max_coder_non_submission_rounds: 3
    analyzer_tools:
    - read_code
    - read_test_file
    - read_prompt
    - run_static_analysis
    - locate_bug
    executor_tools:
    - read_code
    - read_test_file
    - build_only
    - test_only
    - run_compute_sanitizer
    - locate_bug
    coder_tools:
    - read_code
    - read_test_file
    - read_prompt
    - build_only
    - apply_edit
    - write_solution
  token_budget: 200000
  budget_warn_ratio: 0.8
  budget_force_ratio: 0.95
  keep_recent_tool_exchanges: 6
  compact_old_iterations: true
  tool_result_cap_chars: 8000
  use_llm_summary: false
  summary_target_chars: 4000
  summary_max_tokens: 32768
  max_summary_calls: 40
  tool_choice: required
logging:
  level: INFO
  save_api_responses: true
